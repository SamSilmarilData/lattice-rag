name: CI Evaluation Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff & Mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint
        run: ruff check src tests

      - name: Ruff Format
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src

  unit-tests:
    name: Hermetic Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Hermetic Unit Tests
        env:
          TYPESAFE_API_KEY: "mock-typesafe-key-for-hermetic-unit-tests"
          GROQ_API_KEY: "mock-groq-key-for-hermetic-unit-tests"
          GEMINI_API_KEY: "mock-gemini-key-for-hermetic-unit-tests"
        run: |
          pytest tests/unit/ -v

  frontend:
    name: Studio Type-Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type-Check & Build
        run: npm run build

  hermetic-tier:
    # The required PR gate (ADR-0002). Uses no secrets, so it runs for fork PRs too.
    name: Hermetic Tier (Retrieval Gate)
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.model-cache/huggingface
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.model-cache/fastembed
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Embedding & Reranker Models
        id: models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .model-cache
          # Model names and revisions live in config.py; fastembed's version is in pyproject.toml
          key: hermetic-models-${{ runner.os }}-${{ hashFiles('src/lattice_rag/config.py', 'pyproject.toml') }}

      - name: Log reranker kernel class
        # INT8 rerank scores differ by CPU kernel (AVX2 vs AVX-512 VNNI); see production-readiness.md
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -qm1 avx512_vnni /proc/cpuinfo; then echo "kernel class: avx512_vnni"; else echo "kernel class: avx2"; fi

      - name: Run Hermetic Tier (Gold Set validation, recall & MRR per Slice)
        env:
          # Once the models are cached the run must not touch the network
          HF_HUB_OFFLINE: ${{ steps.models.outputs.cache-hit == 'true' && '1' || '0' }}
        run: lattice-rag hermetic --dataset eval_dataset.json --thresholds hermetic_thresholds.json --output hermetic_report.json

      - name: Prove the Gate Fails on a Broken Retriever
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest tests/hermetic/ -v

  # The Live Tier (Jev-judged metrics) is advisory and does not run on PRs: it lives in
  # live-tier.yml, nightly and on demand (ADR-0002).
