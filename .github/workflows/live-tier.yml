name: Live Tier (Advisory)

# The Live Tier judges answers with Jev (faithfulness, context precision, answer
# relevance, answer correctness) against eval_baseline.json. It is advisory (ADR-0002):
# it never runs on pull requests, so it cannot block a merge. It runs nightly and on
# demand. Both triggers run in this repository with its secrets, so a missing secret is
# a configuration error and fails the run visibly; it is never skipped.

on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      guardrail_skip_rerank_score:
        description: >-
          Trial value for GUARDRAIL_SKIP_RERANK_SCORE (rerank logit at or above which chunks
          skip the Noul guardrail). Empty keeps the shipped default: off. See
          docs/production-readiness.md section 6.
        required: false
        default: ""

concurrency:
  # One live run at a time: runs share the provider rate limits
  group: live-tier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-tier:
    name: Live Tier (Jev-judged, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.model-cache/huggingface
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.model-cache/fastembed
    steps:
      - name: Require Live Tier Secrets
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          missing=""
          [ -n "$TYPESAFE_API_KEY" ] || missing="$missing TYPESAFE_API_KEY"
          [ -n "$GROQ_API_KEY" ] || missing="$missing GROQ_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Live Tier secrets missing::Repository secret(s)${missing} are not set. The Live Tier cannot judge answers without them; add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Embedding, Reranker & GLiNER Models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .model-cache
          key: live-models-${{ runner.os }}-${{ hashFiles('src/lattice_rag/config.py', 'src/lattice_rag/storage/extract.py', 'pyproject.toml') }}

      - name: Run Live Tier (ephemeral DB, Gold Set vs baseline)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Empty on the nightly schedule, so the gate stays off unless a manual run sets it
          GUARDRAIL_SKIP_RERANK_SCORE: ${{ inputs.guardrail_skip_rerank_score }}
        run: |
          lattice-rag eval --dataset eval_dataset.json --baseline eval_baseline.json \
            --output live_tier_report.json

      - name: Upload Live Tier Report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-tier-report
          path: live_tier_report.json
          if-no-files-found: warn
