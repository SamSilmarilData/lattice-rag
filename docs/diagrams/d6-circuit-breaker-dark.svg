<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg" aria-labelledby="d6-dark-title d6-dark-desc" id="d6-circuit-breaker-dark-root">
        <title id="d6-dark-title">3-Tier Resilient Circuit Breaker Cascade Diagram</title>
        <desc id="d6-dark-desc">State machine transitions between Closed, Open, and Half-Open states paired with an execution cascade across GroqCloud, Gemini 3.8 Flash, and Redis FAQ fallback.</desc>

        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d6-circuit-breaker-dark-root { --color-paper:        #0b0f19;
      --color-paper-2:      #111827;
      --color-ink:          #f1f5f9;
      --color-muted:        #94a3b8;
      --color-soft:         #cbd5e1;
      --color-accent:       #22d3ee;
      --color-accent-tint:  rgba(34, 211, 238, 0.12);
      --color-link:         #818cf8;
      --color-rule:         rgba(34, 211, 238, 0.20);
      --color-rule-solid:   #1f2937;
      --color-emerald:      #10b981;
      --color-emerald-tint: rgba(16, 185, 129, 0.12);
      --color-coral:        #f43f5e;
      --color-coral-tint:   rgba(244, 63, 94, 0.12);
      --color-amber:        #f59e0b;
      --color-amber-tint:   rgba(245, 158, 11, 0.12);
      --font-sans:          'Inter', 'Geist', system-ui, sans-serif;
      --font-serif:         'Instrument Serif', 'Noto Serif', serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace; }
      #d6-circuit-breaker-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d6-circuit-breaker-dark-root .lead { color: var(--color-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 780px;
      margin-bottom: 1.75rem; }
      #d6-circuit-breaker-dark-root .diagram-card { background: var(--color-paper-2);
      border: 1px solid var(--color-rule-solid);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7); }
      #d6-circuit-breaker-dark-root .card-footer { display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule-solid);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted); }
      #d6-circuit-breaker-dark-root .card-footer a { color: var(--color-accent);
      text-decoration: none; }</style>
          <marker id="d6-circuit-breaker-dark-d6-dark-arr-ink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#94a3b8"/>
          </marker>
          <marker id="d6-circuit-breaker-dark-d6-dark-arr-accent" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#22d3ee"/>
          </marker>
          <marker id="d6-circuit-breaker-dark-d6-dark-arr-coral" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f43f5e"/>
          </marker>
          <marker id="d6-circuit-breaker-dark-d6-dark-arr-emerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#10b981"/>
          </marker>
          <marker id="d6-circuit-breaker-dark-d6-dark-arr-indigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#818cf8"/>
          </marker>

          <!-- Drop shadow filter -->
          <filter id="d6-circuit-breaker-dark-d6-dark-shadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
          </filter>
        </defs>

        <!-- SUBTLE BACKGROUND GRID ACCENT -->
        <g opacity="0.12">
          <line x1="60" y1="205" x2="900" y2="205" stroke="#22d3ee" stroke-dasharray="4 4" stroke-width="1.5"/>
        </g>

        <!-- SECTION DIVIDER BADGE -->
        <g transform="translate(350, 195)">
          <rect x="0" y="0" width="260" height="20" rx="10" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="130" y="14" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.12em">RUNTIME EXECUTION CASCADE</text>
        </g>

        <!-- ========================================== -->
        <!-- CONNECTORS (DRAWN BEFORE NODES FOR DEPTH) -->
        <!-- ========================================== -->
        <g id="d6-dark-connectors">
          <!-- 1. CLOSED -> OPEN -->
          <line x1="280" y1="97" x2="372" y2="97" stroke="#f43f5e" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
          <rect x="295" y="87" width="64" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="327" y="101" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">3 fails / 429</text>

          <!-- 2. OPEN -> HALF-OPEN -->
          <line x1="600" y1="97" x2="692" y2="97" stroke="#818cf8" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-indigo)"/>
          <rect x="612" y="87" width="70" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="647" y="101" fill="#818cf8" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">reset 30s</text>

          <!-- 3. HALF-OPEN -> OPEN (Probe Fails) -->
          <path d="M 790 50 L 790 28 A 8 8 0 0 0 782 20 L 498 20 A 8 8 0 0 0 490 28 L 490 42" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
          <rect x="600" y="10" width="76" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="638" y="24" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">probe failed</text>

          <!-- 4. HALF-OPEN -> CLOSED (Probe Succeeds) -->
          <path d="M 810 145 L 810 167 A 8 8 0 0 1 802 175 L 178 175 A 8 8 0 0 1 170 167 L 170 153" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-emerald)"/>
          <rect x="420" y="165" width="160" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="500" y="179" fill="#10b981" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">probe ok → reset breaker</text>

          <!-- 5. Dispatcher -> Tier 1 Groq (Breaker CLOSED) -->
          <line x1="280" y1="292" x2="352" y2="292" stroke="#22d3ee" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-accent)"/>
          <rect x="290" y="282" width="56" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="318" y="296" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">CLOSED</text>

          <!-- 6. Groq -> Client Stream (200 OK) -->
          <line x1="620" y1="292" x2="692" y2="292" stroke="#22d3ee" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-accent)"/>
          <rect x="632" y="282" width="54" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="659" y="296" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">200 OK</text>

          <!-- 7. Groq -> Gemini (Mid-flight Failure) -->
          <line x1="490" y1="340" x2="490" y2="382" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
          <rect x="450" y="352" width="80" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="490" y="366" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Groq Exception</text>

          <!-- 8. Dispatcher -> Gemini (Direct route when OPEN) -->
          <line x1="280" y1="437" x2="352" y2="437" stroke="#f59e0b" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-ink)"/>
          <rect x="292" y="427" width="52" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="318" y="441" fill="#f59e0b" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">OPEN</text>

          <!-- 9. Gemini -> Redis FAQ (Cascade 2) -->
          <line x1="620" y1="437" x2="692" y2="437" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
          <rect x="630" y="427" width="58" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="659" y="441" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Gemini Err</text>

          <!-- 10. Gemini -> Client Stream (Degraded) -->
          <path d="M 580 390 L 580 373 A 8 8 0 0 1 588 365 L 722 365 A 8 8 0 0 0 730 357 L 730 348" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-ink)"/>
          <rect x="615" y="355" width="80" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="655" y="369" fill="#f59e0b" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Degraded SSE</text>

          <!-- 11. Redis FAQ -> Client Stream (Offline FAQ) -->
          <line x1="800" y1="390" x2="800" y2="348" stroke="#10b981" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-emerald)"/>
          <rect x="755" y="355" width="90" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
          <text x="800" y="369" fill="#10b981" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Precomputed FAQ</text>
        </g>

        <!-- ========================================== -->
        <!-- ROW 1: FINITE STATE MACHINE (3 NODES)      -->
        <!-- ========================================== -->

        <!-- NODE 1: CLOSED STATE (FOCAL ACCENT 1) -->
        <g id="d6-dark-node-closed" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
          <rect x="60" y="50" width="220" height="95" rx="8" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
          <rect x="74" y="62" width="70" height="18" rx="4" fill="#22d3ee" fill-opacity="0.15"/>
          <text x="109" y="75" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">CLOSED</text>
          <text x="154" y="75" fill="#10b981" font-family="'Geist Mono', monospace" font-size="9" font-weight="600">• NORMAL</text>

          <text x="74" y="100" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Circuit Closed</text>
          <text x="74" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Direct flow to Primary Groq</text>
          <text x="74" y="133" fill="#cbd5e1" font-family="'Geist Mono', monospace" font-size="10">fail_counter = 0 / 3</text>
        </g>

        <!-- NODE 2: OPEN STATE -->
        <g id="d6-dark-node-open" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
          <rect x="380" y="50" width="220" height="95" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5"/>
          <rect x="394" y="62" width="56" height="18" rx="4" fill="#f43f5e" fill-opacity="0.15"/>
          <text x="422" y="75" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">OPEN</text>
          <text x="460" y="75" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9" font-weight="600">• TRIPPED</text>

          <text x="394" y="100" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Circuit Open</text>
          <text x="394" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Groq isolated; fallback active</text>
          <text x="394" y="133" fill="#cbd5e1" font-family="'Geist Mono', monospace" font-size="10">reset_timeout = 30s timer</text>
        </g>

        <!-- NODE 3: HALF-OPEN STATE -->
        <g id="d6-dark-node-half-open" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
          <rect x="700" y="50" width="200" height="95" rx="8" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
          <rect x="714" y="62" width="80" height="18" rx="4" fill="#818cf8" fill-opacity="0.15"/>
          <text x="754" y="75" fill="#818cf8" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">HALF-OPEN</text>

          <text x="714" y="100" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Canary Probe</text>
          <text x="714" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Single trial call to Groq</text>
          <text x="714" y="133" fill="#cbd5e1" font-family="'Geist Mono', monospace" font-size="10">success ? close : open</text>
        </g>

        <!-- ========================================== -->
        <!-- ROW 2 & 3: CASCADE EXECUTION (5 NODES)     -->
        <!-- ========================================== -->

        <!-- NODE 4: DISPATCHER INGRESS -->
        <g id="d6-dark-node-dispatcher" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
          <rect x="60" y="245" width="220" height="240" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
          <rect x="74" y="258" width="105" height="18" rx="4" fill="#1f2937"/>
          <text x="126" y="271" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">ORCHESTRATOR</text>

          <text x="74" y="298" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="14" font-weight="600">ResilientSynthesizer</text>
          <text x="74" y="316" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="10.5">resilient_synthesizer.py</text>

          <line x1="74" y1="332" x2="260" y2="332" stroke="#1f2937" stroke-width="1"/>

          <text x="74" y="352" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">1. Inspects breaker status</text>
          <text x="74" y="372" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5">• If Closed → TIER 1 Groq</text>
          <text x="74" y="390" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5">• If Open → Bypasses to TIER 2</text>
          <text x="74" y="415" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">2. Special Intent Handling</text>
          <text x="74" y="435" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5">• massive_context → Gemini direct</text>
          <text x="74" y="465" fill="#818cf8" font-family="'Geist Mono', monospace" font-size="10">Transparent SSE Streaming</text>
        </g>

        <!-- NODE 5: TIER 1 GROQCLOUD PRIMARY (FOCAL ACCENT 2) -->
        <g id="d6-dark-node-tier1" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
          <rect x="360" y="245" width="260" height="95" rx="8" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
          <rect x="374" y="257" width="100" height="18" rx="4" fill="#22d3ee" fill-opacity="0.15"/>
          <text x="424" y="270" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">TIER 1 • PRIMARY</text>

          <text x="374" y="296" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">GroqCloud Llama 3.3</text>
          <text x="374" y="314" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">llama-3.3-70b-versatile</text>
          <text x="374" y="330" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="10">200+ tok/s • ~224ms TTFT</text>
        </g>

        <!-- NODE 6: TIER 2 GEMINI FALLBACK -->
        <g id="d6-dark-node-tier2" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
          <rect x="360" y="390" width="260" height="95" rx="8" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
          <rect x="374" y="402" width="112" height="18" rx="4" fill="#818cf8" fill-opacity="0.15"/>
          <text x="430" y="415" fill="#818cf8" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">TIER 2 • CASCADE 1</text>

          <text x="374" y="441" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Google Gemini 3.8 Flash</text>
          <text x="374" y="459" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Massive context &amp; API failover</text>
          <text x="374" y="475" fill="#cbd5e1" font-family="'Geist Mono', monospace" font-size="10">1M Token Window • ~850ms</text>
        </g>

        <!-- NODE 7: CLIENT SSE STREAM (DESTINATION) -->
        <g id="d6-dark-node-client" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
          <rect x="700" y="245" width="200" height="95" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
          <rect x="714" y="257" width="80" height="18" rx="4" fill="#10b981" fill-opacity="0.15"/>
          <text x="754" y="270" fill="#10b981" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">EGRESS</text>

          <text x="714" y="296" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Client Response</text>
          <text x="714" y="314" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Token-by-token stream</text>
          <text x="714" y="330" fill="#10b981" font-family="'Geist Mono', monospace" font-size="10">SSE Protocol / HTTP 200</text>
        </g>

        <!-- NODE 8: TIER 3 REDIS FAQ HASH -->
        <g id="d6-dark-node-tier3" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
          <rect x="700" y="390" width="200" height="95" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
          <rect x="714" y="402" width="112" height="18" rx="4" fill="#1f2937"/>
          <text x="770" y="415" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">TIER 3 • CASCADE 2</text>

          <text x="714" y="441" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Redis FAQ Hash</text>
          <text x="714" y="459" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Precomputed Q&amp;A map</text>
          <text x="714" y="475" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="10">cache:fallback:queries</text>
        </g>
      </svg>
