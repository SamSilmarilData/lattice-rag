<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" aria-labelledby="d6-dark-title d6-dark-desc" id="d6-circuit-breaker-dark-root">
<title id="d6-dark-title">Model Pool Cascade and Per-Member Circuit Breaker</title>
<desc id="d6-dark-desc">Each Model Pool member has its own Closed, Open and Half-Open breaker; the Resilient Synthesizer tries the members in order, any member's answer goes to the client attributed by provider and model, and only when every member fails is the degraded Redis FAQ answer served.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d6-circuit-breaker-dark-root { --color-paper:        #0b0f19;
      --color-paper-2:      #111827;
      --color-ink:          #f1f5f9;
      --color-muted:        #94a3b8;
      --color-soft:         #cbd5e1;
      --color-accent:       #22d3ee;
      --color-accent-tint:  rgba(34, 211, 238, 0.12);
      --color-link:         #818cf8;
      --color-rule:         rgba(34, 211, 238, 0.20);
      --color-rule-solid:   #1f2937;
      --color-emerald:      #10b981;
      --color-emerald-tint: rgba(16, 185, 129, 0.12);
      --color-coral:        #f43f5e;
      --color-coral-tint:   rgba(244, 63, 94, 0.12);
      --color-amber:        #f59e0b;
      --color-amber-tint:   rgba(245, 158, 11, 0.12);
      --font-sans:          'Inter', 'Geist', system-ui, sans-serif;
      --font-serif:         'Instrument Serif', 'Noto Serif', serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace; }
      #d6-circuit-breaker-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d6-circuit-breaker-dark-root .lead { color: var(--color-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 780px;
      margin-bottom: 1.75rem; }
      #d6-circuit-breaker-dark-root .diagram-card { background: var(--color-paper-2);
      border: 1px solid var(--color-rule-solid);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7); }
      #d6-circuit-breaker-dark-root .card-footer { display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule-solid);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted); }
      #d6-circuit-breaker-dark-root .card-footer a { color: var(--color-accent);
      text-decoration: none; }</style>
<marker id="d6-circuit-breaker-dark-d6-dark-arr-ink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#94a3b8"/></marker>
<marker id="d6-circuit-breaker-dark-d6-dark-arr-accent" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#22d3ee"/></marker>
<marker id="d6-circuit-breaker-dark-d6-dark-arr-coral" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#f43f5e"/></marker>
<marker id="d6-circuit-breaker-dark-d6-dark-arr-emerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#10b981"/></marker>
<marker id="d6-circuit-breaker-dark-d6-dark-arr-indigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#818cf8"/></marker>
<marker id="d6-circuit-breaker-dark-d6-dark-arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#f59e0b"/></marker>
<filter id="d6-circuit-breaker-dark-d6-dark-shadow" x="-5%" y="-5%" width="110%" height="115%">
  <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
</filter>
</defs>

<g opacity="0.12">
  <line x1="60" y1="205" x2="900" y2="205" stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.5"/>
</g>
<g transform="translate(340, 195)">
  <rect x="0" y="0" width="280" height="20" rx="10" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
  <text x="140" y="14" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.12em">MODEL POOL CASCADE</text>
</g>
<text x="60" y="38" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">ONE BREAKER PER POOL MEMBER</text>

<g id="d6-dark-connectors">
  <!-- breaker state machine -->
  <line x1="280" y1="97" x2="372" y2="97" stroke="#f43f5e" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
  <rect x="295" y="71" width="64" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="327" y="85" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">3 failures</text>
  <line x1="600" y1="97" x2="692" y2="97" stroke="#818cf8" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-indigo)"/>
  <rect x="612" y="71" width="70" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="647" y="85" fill="#818cf8" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">reset 30s</text>
  <path d="M 790 50 L 790 28 A 8 8 0 0 0 782 20 L 498 20 A 8 8 0 0 0 490 28 L 490 42" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
  <rect x="600" y="26" width="76" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="638" y="40" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">probe failed</text>
  <path d="M 810 145 L 810 167 A 8 8 0 0 1 802 175 L 178 175 A 8 8 0 0 1 170 167 L 170 153" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-emerald)"/>
  <rect x="618" y="149" width="64" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="650" y="163" fill="#10b981" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">probe ok</text>

  <!-- synthesizer -> first member -->
  <line x1="280" y1="275" x2="352" y2="275" stroke="#22d3ee" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-accent)"/>
  <rect x="286" y="247" width="60" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="316" y="261" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">in order</text>

  <!-- fall through to the next member -->
  <line x1="490" y1="305" x2="490" y2="333" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
  <rect x="500" y="309" width="104" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="552" y="323" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">fail / timeout</text>
  <line x1="490" y1="401" x2="490" y2="429" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
  <rect x="500" y="405" width="104" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="552" y="419" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">fail / timeout</text>

  <!-- any member's answer -> client (attributed, cacheable) -->
  <line x1="620" y1="269" x2="692" y2="269" stroke="#22d3ee" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-accent)"/>
  <rect x="626" y="243" width="60" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="656" y="257" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">answer</text>
  <path d="M 620 371 L 632 371 A 8 8 0 0 0 640 363 L 640 300 A 8 8 0 0 1 648 292 L 692 292" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-accent)"/>
  <path d="M 620 467 L 648 467 A 8 8 0 0 0 656 459 L 656 324 A 8 8 0 0 1 664 316 L 692 316" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-accent)"/>

  <!-- no member answered -> FAQ -> client (degraded) -->
  <line x1="620" y1="485" x2="692" y2="485" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-coral)"/>
  <rect x="622" y="493" width="68" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="656" y="507" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">all failed</text>
  <line x1="800" y1="405" x2="800" y2="348" stroke="#f59e0b" stroke-width="2" marker-end="url(#d6-circuit-breaker-dark-d6-dark-arr-amber)"/>
  <rect x="810" y="366" width="64" height="20" rx="4" fill="#0b0f19" stroke="#1f2937" stroke-width="1"/>
<text x="842" y="380" fill="#f59e0b" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">degraded</text>
</g>

<g id="d6-dark-node-closed" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="60" y="50" width="220" height="95" rx="8" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <rect x="74" y="62" width="70" height="18" rx="2" fill="#22d3ee" fill-opacity="0.15"/>
  <text x="109" y="75" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">CLOSED</text>
  <text x="74" y="100" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Member available</text>
  <text x="74" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Tried in its pool position</text>
  <text x="74" y="133" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="10">fail_max = 3</text>
</g>
<g id="d6-dark-node-open" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="380" y="50" width="220" height="95" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="394" y="62" width="56" height="18" rx="2" fill="#f43f5e" fill-opacity="0.15"/>
  <text x="422" y="75" fill="#f43f5e" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">OPEN</text>
  <text x="394" y="100" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Member skipped</text>
  <text x="394" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Next member takes the query</text>
  <text x="394" y="133" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="10">reset_timeout = 30s</text>
</g>
<g id="d6-dark-node-half-open" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="700" y="50" width="200" height="95" rx="8" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="714" y="62" width="80" height="18" rx="2" fill="#818cf8" fill-opacity="0.15"/>
  <text x="754" y="75" fill="#818cf8" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">HALF-OPEN</text>
  <text x="714" y="100" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Probe</text>
  <text x="714" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">One trial call to the member</text>
  <text x="714" y="133" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="10">ok ? close : open</text>
</g>

<g id="d6-dark-node-synth" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="60" y="245" width="220" height="252" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="74" y="258" width="104" height="18" rx="2" fill="#1f2937"/>
  <text x="126" y="271" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">GENERATION</text>
  <text x="74" y="298" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="14" font-weight="600">ResilientSynthesizer</text>
  <text x="74" y="316" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="10.5">LLM_POOL</text>
  <line x1="74" y1="332" x2="260" y2="332" stroke="#1f2937" stroke-width="1"/>
  <text x="74" y="352" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">Same order on every Route</text>
  <text x="74" y="370" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5">• massive_context: larger budget</text>
  <text x="74" y="395" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">Any member's answer is normal</text>
  <text x="74" y="413" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5">• judged, cached in Tier 1</text>
  <text x="74" y="430" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5">• attributed: provider + model</text>
  <text x="74" y="455" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">No retries; move on at once</text>
  <text x="74" y="478" fill="#818cf8" font-family="'Geist Mono', monospace" font-size="10">No fall-through after 1st token</text>
</g>

<g id="d6-dark-node-m1" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="360" y="245" width="260" height="60" rx="8" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <rect x="374" y="253" width="64" height="18" rx="2" fill="#22d3ee" fill-opacity="0.15"/>
  <text x="406" y="266" fill="#22d3ee" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">1 · GROQ</text>
  <text x="448" y="266" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">qwen/qwen3.8-27b</text>
  <text x="374" y="291" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="10">GROQ_MODEL</text>
</g>
<g id="d6-dark-node-m2" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="360" y="341" width="260" height="60" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="374" y="349" width="64" height="18" rx="2" fill="#1f2937"/>
  <text x="406" y="362" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">2 · GROQ</text>
  <text x="448" y="362" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">openai/gpt-oss-120b</text>
  <text x="374" y="387" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="10">own breaker · own free quota</text>
</g>
<g id="d6-dark-node-m3" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="360" y="437" width="260" height="60" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="374" y="445" width="72" height="18" rx="2" fill="#1f2937"/>
  <text x="410" y="458" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">3 · GEMINI</text>
  <text x="456" y="458" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">gemini-3.5-flash-lite</text>
  <text x="374" y="483" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="10">GEMINI_MODEL · no thinking config</text>
</g>

<g id="d6-dark-node-client" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="700" y="245" width="200" height="95" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <rect x="714" y="257" width="64" height="18" rx="2" fill="#10b981" fill-opacity="0.15"/>
  <text x="746" y="270" fill="#10b981" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">EGRESS</text>
  <text x="714" y="296" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Client Response</text>
  <text x="714" y="314" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">JSON or SSE done event</text>
  <text x="714" y="330" fill="#10b981" font-family="'Geist Mono', monospace" font-size="10">provider · model</text>
</g>
<g id="d6-dark-node-faq" filter="url(#d6-circuit-breaker-dark-d6-dark-shadow)">
  <rect x="700" y="405" width="200" height="92" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="714" y="417" width="72" height="18" rx="2" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="750" y="430" fill="#f59e0b" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">DEGRADED</text>
  <text x="714" y="456" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Redis FAQ Hash</text>
  <text x="714" y="472" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Closest seeded answer</text>
  <text x="714" y="487" fill="#94a3b8" font-family="'Geist Mono', monospace" font-size="10">never cached</text>
</g>
</svg>
