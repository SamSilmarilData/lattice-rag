<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" viewBox="0 0 980 540" width="980" height="540" xmlns="http://www.w3.org/2000/svg" aria-labelledby="d9-light-title d9-light-desc" id="d9-deployment-topology-light-root">
        <title id="d9-light-title">Single-Container Production Deployment Topology Diagram</title>
        <desc id="d9-light-desc">Topology diagram illustrating ingress traffic, the Granian Rust ASGI server, Litestar web framework, CPU ProcessPool isolation, embedded LatticeDB file, and outbound resilient generation within a single Docker container boundary.</desc>

        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d9-deployment-topology-light-root { --color-paper:        #f8fafc;
      --color-paper-2:      #ffffff;
      --color-ink:          #0f172a;
      --color-muted:        #475569;
      --color-soft:         #64748b;
      --color-accent:       #0e7490;
      --color-accent-tint:  rgba(14, 116, 144, 0.10);
      --color-link:         #4338ca;
      --color-rule:         rgba(14, 116, 144, 0.20);
      --color-rule-solid:   #e2e8f0;
      --color-emerald:      #047857;
      --color-emerald-tint: rgba(4, 120, 87, 0.10);
      --color-amber:        #b45309;
      --font-sans:          'Inter', 'Geist', system-ui, sans-serif;
      --font-serif:         'Instrument Serif', 'Noto Serif', serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace; }
      #d9-deployment-topology-light-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d9-deployment-topology-light-root .lead { color: var(--color-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 820px;
      margin-bottom: 1.75rem; }
      #d9-deployment-topology-light-root .diagram-card { background: var(--color-paper-2);
      border: 1px solid var(--color-rule-solid);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08); }
      #d9-deployment-topology-light-root .card-footer { display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule-solid);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted); }
      #d9-deployment-topology-light-root .card-footer a { color: var(--color-accent);
      text-decoration: none; }</style>
          <marker id="d9-deployment-topology-light-d9-light-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#475569"/>
          </marker>
          <marker id="d9-deployment-topology-light-d9-light-arr-accent" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#0e7490"/>
          </marker>
          <marker id="d9-deployment-topology-light-d9-light-arr-emerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#047857"/>
          </marker>
          <marker id="d9-deployment-topology-light-d9-light-arr-indigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#4338ca"/>
          </marker>

          <filter id="d9-deployment-topology-light-d9-light-shadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
          </filter>
        </defs>

        <!-- CONTAINER BOUNDARY BOX -->
        <g id="d9-light-container-boundary">
          <rect x="180" y="40" width="765" height="465" rx="12" fill="#f8fafc" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="6 4"/>
          <rect x="195" y="28" width="350" height="22" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1"/>
          <text x="370" y="43" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.12em">SINGLE DOCKER CONTAINER BOUNDARY (1 GB RAM TARGET)</text>
        </g>

        <!-- ========================================== -->
        <!-- CONNECTORS (DRAWN BEFORE NODES FOR DEPTH) -->
        <!-- ========================================== -->
        <g id="d9-light-connectors">
          <!-- 1. INGRESS -> GRANIAN -->
          <line x1="145" y1="125" x2="202" y2="125" stroke="#0e7490" stroke-width="2" marker-end="url(#d9-deployment-topology-light-d9-light-arr-accent)"/>
          <rect x="150" y="115" width="48" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="174" y="128" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="middle">:8000</text>

          <!-- 2. GRANIAN -> LITESTAR -->
          <line x1="400" y1="125" x2="432" y2="125" stroke="#4338ca" stroke-width="2" marker-end="url(#d9-deployment-topology-light-d9-light-arr-indigo)"/>
          <rect x="403" y="115" width="28" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="417" y="128" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="middle">ASGI</text>

          <!-- 3. LITESTAR -> TIER 1 CACHE -->
          <line x1="660" y1="125" x2="692" y2="125" stroke="#047857" stroke-width="2" marker-end="url(#d9-deployment-topology-light-d9-light-arr-emerald)"/>
          <rect x="664" y="115" width="25" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="676" y="128" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="middle">&lt;1ms</text>

          <!-- 4. LITESTAR -> TYPESAFE AI (Rounded elbow) -->
          <path d="M 480 170 L 480 192 A 8 8 0 0 1 472 200 L 313 200 A 8 8 0 0 0 305 208 L 305 212" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#d9-deployment-topology-light-d9-light-arr-indigo)"/>
          <rect x="360" y="190" width="70" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="395" y="203" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="middle">Jev Triage</text>

          <!-- 5. LITESTAR -> CPU POOL -->
          <line x1="550" y1="170" x2="550" y2="212" stroke="#0e7490" stroke-width="2" marker-end="url(#d9-deployment-topology-light-d9-light-arr-accent)"/>
          <rect x="522" y="185" width="56" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="550" y="198" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="middle">CPU Pool</text>

          <!-- 6. CPU POOL -> LATTICEDB -->
          <line x1="550" y1="330" x2="550" y2="372" stroke="#0e7490" stroke-width="2" marker-end="url(#d9-deployment-topology-light-d9-light-arr-accent)"/>
          <rect x="520" y="345" width="60" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="550" y="358" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="middle">C-Bindings</text>

          <!-- 7. LITESTAR -> RESILIENT EGRESS (Rounded elbow) -->
          <path d="M 640 170 L 640 192 A 8 8 0 0 0 648 200 L 787 200 A 8 8 0 0 1 795 208 L 795 212" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#d9-deployment-topology-light-d9-light-arr)"/>

          <!-- 8. LATTICEDB -> RESILIENT EGRESS (Rounded elbow) -->
          <path d="M 660 425 L 787 425 A 8 8 0 0 0 795 417 L 795 338" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#d9-deployment-topology-light-d9-light-arr-emerald)"/>
          <rect x="750" y="360" width="75" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="787" y="373" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="middle">Chunk Evidence</text>
        </g>

        <!-- ========================================== -->
        <!-- 8 ARCHITECTURAL NODES                      -->
        <!-- ========================================== -->

        <!-- NODE 1: INGRESS (EXTERNAL CLIENT & PROBES) -->
        <g id="d9-light-node-1" filter="url(#d9-deployment-topology-light-d9-light-shadow)">
          <rect x="35" y="80" width="110" height="390" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="45" y="92" width="70" height="18" rx="3" fill="#f1f5f9"/>
          <text x="80" y="105" fill="#475569" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">INGRESS</text>

          <text x="45" y="132" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Client</text>
          <text x="45" y="148" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">External</text>

          <line x1="45" y1="162" x2="135" y2="162" stroke="#e2e8f0" stroke-width="1"/>

          <text x="45" y="184" fill="#0f172a" font-family="'Geist Mono', monospace" font-size="9.5">• HTTP / SSE</text>
          <text x="45" y="202" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• POST /query</text>
          <text x="45" y="220" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• GET /health</text>
          <text x="45" y="238" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• GET /stream</text>
          <text x="45" y="256" fill="#475569" font-family="'Geist Mono', monospace" font-size="9">• /schema</text>

          <line x1="45" y1="274" x2="135" y2="274" stroke="#e2e8f0" stroke-width="1"/>

          <text x="45" y="296" fill="#047857" font-family="'Inter', sans-serif" font-size="10" font-weight="600">K8s Probes</text>
          <text x="45" y="312" fill="#475569" font-family="'Geist Mono', monospace" font-size="8.5">Liveness: 15s</text>
          <text x="45" y="328" fill="#475569" font-family="'Geist Mono', monospace" font-size="8.5">Readiness: 5s</text>

          <rect x="45" y="425" width="90" height="22" rx="3" fill="#0e7490" fill-opacity="0.12"/>
          <text x="90" y="439" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">PORT 8000</text>
        </g>

        <!-- NODE 2: GRANIAN RUST ASGI SERVER -->
        <g id="d9-light-node-2" filter="url(#d9-deployment-topology-light-d9-light-shadow)">
          <rect x="210" y="80" width="190" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="222" y="92" width="75" height="18" rx="3" fill="#f1f5f9"/>
          <text x="259" y="105" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">RUST ASGI</text>

          <text x="222" y="130" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Granian Server</text>
          <text x="222" y="146" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">Multi-threaded Rust core</text>
          <text x="222" y="160" fill="#64748b" font-family="'Geist Mono', monospace" font-size="9">Non-blocking HTTP / SSE</text>
        </g>

        <!-- NODE 3: LITESTAR ENGINE (FOCAL ACCENT 1) -->
        <g id="d9-light-node-3" filter="url(#d9-deployment-topology-light-d9-light-shadow)">
          <rect x="440" y="80" width="220" height="90" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
          <rect x="452" y="92" width="105" height="18" rx="3" fill="#0e7490" fill-opacity="0.12"/>
          <text x="504" y="105" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">WEB ENGINE [FOCAL]</text>

          <text x="452" y="130" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">Litestar 2.24 Framework</text>
          <text x="452" y="146" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">msgspec DTOs • OpenAPI Scalar</text>
          <text x="452" y="160" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="9">Async Task Orchestration</text>
        </g>

        <!-- NODE 4: TIER 1 SEMANTIC CACHE -->
        <g id="d9-light-node-4" filter="url(#d9-deployment-topology-light-d9-light-shadow)">
          <rect x="700" y="80" width="210" height="90" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
          <rect x="712" y="92" width="85" height="18" rx="3" fill="#047857" fill-opacity="0.12"/>
          <text x="754" y="105" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">TIER 1 CACHE</text>

          <text x="712" y="130" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">In-Memory Cache</text>
          <text x="712" y="146" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">Vectorized cosine table</text>
          <text x="712" y="160" fill="#047857" font-family="'Geist Mono', monospace" font-size="9">p95 = 1.2ms • ~4,000 QPS</text>
        </g>

        <!-- NODE 5: TYPESAFE AI DECISION ENGINE -->
        <g id="d9-light-node-5" filter="url(#d9-deployment-topology-light-d9-light-shadow)">
          <rect x="210" y="220" width="190" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="222" y="232" width="85" height="18" rx="3" fill="#f1f5f9"/>
          <text x="264" y="245" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">SYSTEM ONE</text>

          <text x="222" y="270" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">TypeSafe AI Jev</text>
          <text x="222" y="288" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">• Choice 5-Way Router</text>
          <text x="222" y="304" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">• Noul Noise Guardrail</text>
          <text x="222" y="320" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8.5">Low-latency decision logic</text>
        </g>

        <!-- NODE 6: PROCESSPOOL CPU WORKERS -->
        <g id="d9-light-node-6" filter="url(#d9-deployment-topology-light-d9-light-shadow)">
          <rect x="440" y="220" width="220" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="452" y="232" width="95" height="18" rx="3" fill="#f1f5f9"/>
          <text x="499" y="245" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">CPU ISOLATION</text>

          <text x="452" y="270" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">ProcessPoolExecutor</text>
          <text x="452" y="288" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">• FastEmbed (bge-small-en)</text>
          <text x="452" y="304" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">• INT8 Cross-Encoder Rerank</text>
          <text x="452" y="320" fill="#64748b" font-family="'Geist Mono', monospace" font-size="8.5">GLiNER 2.5 NER • 4 threads</text>
        </g>

        <!-- NODE 7: LATTICEDB EMBEDDED ENGINE (FOCAL ACCENT 2) -->
        <g id="d9-light-node-7" filter="url(#d9-deployment-topology-light-d9-light-shadow)">
          <rect x="440" y="380" width="220" height="95" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
          <rect x="452" y="392" width="115" height="18" rx="3" fill="#0e7490" fill-opacity="0.12"/>
          <text x="509" y="405" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">STORAGE [FOCAL]</text>

          <text x="452" y="428" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">LatticeDB Engine</text>
          <text x="452" y="446" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">Property Graph + HNSW + BM25</text>
          <text x="452" y="462" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="9">data/lattice_rag.db • 65MB</text>
        </g>

        <!-- NODE 8: RESILIENT CLOUD EGRESS -->
        <g id="d9-light-node-8" filter="url(#d9-deployment-topology-light-d9-light-shadow)">
          <rect x="700" y="220" width="210" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="712" y="232" width="85" height="18" rx="3" fill="#f1f5f9"/>
          <text x="754" y="245" fill="#475569" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">CLOUD EGRESS</text>

          <text x="712" y="270" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Resilient Synthesis</text>
          <text x="712" y="288" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">• GroqCloud Llama 3.3</text>
          <text x="712" y="304" fill="#475569" font-family="'Inter', sans-serif" font-size="10.5">• Gemini 3.8 Flash Fallback</text>
          <text x="712" y="320" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5">Redis Hash Offline Fallback</text>
        </g>
      </svg>
