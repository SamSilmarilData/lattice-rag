<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" viewBox="0 0 1000 612" width="1000" height="612" xmlns="http://www.w3.org/2000/svg" aria-labelledby="d10-cicd-pipeline-dark-title d10-cicd-pipeline-dark-desc" id="d10-cicd-pipeline-dark-root">
        <title id="d10-cicd-pipeline-dark-title">CI Quality Gates &amp; Live Tier</title>
        <desc id="d10-cicd-pipeline-dark-desc">Pull requests and pushes to main run four parallel blocking jobs, lint, unit-tests, frontend and the key-free Hermetic Tier retrieval gate that also runs for forks, before a merge; the Jev-judged Live Tier runs separately, nightly or on demand, as an advisory report with a measured 0.06 tolerance, and Cloud Run deploys are manual.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d10-cicd-pipeline-dark-root { --color-paper:        #0b0f19;
      --color-paper-2:      #111827;
      --color-ink:          #f1f5f9;
      --color-muted:        #94a3b8;
      --color-accent:       #22d3ee;
      --color-rule-solid:   #1f2937;
      --font-sans:          'Inter', 'Geist', system-ui, sans-serif;
      --font-serif:         'Instrument Serif', 'Noto Serif', serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace; }
      #d10-cicd-pipeline-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d10-cicd-pipeline-dark-root .lead { color: var(--color-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 820px;
      margin-bottom: 1.75rem; }
      #d10-cicd-pipeline-dark-root .diagram-card { background: var(--color-paper-2);
      border: 1px solid var(--color-rule-solid);
      border-radius: 8px;
      padding: 1.5rem;
      overflow-x: auto; }
      #d10-cicd-pipeline-dark-root .card-footer { display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: space-between;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule-solid);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted); }
      #d10-cicd-pipeline-dark-root .card-footer a { color: var(--color-accent); text-decoration: none; }</style>
