<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice RAG — LatticeDB Storage Schema</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:        #0b0f19;
      --color-paper-2:      #111827;
      --color-ink:          #f1f5f9;
      --color-muted:        #94a3b8;
      --color-soft:         #cbd5e1;
      --color-accent:       #22d3ee;
      --color-accent-tint:  rgba(34, 211, 238, 0.12);
      --color-link:         #818cf8;
      --color-rule:         rgba(34, 211, 238, 0.20);
      --color-rule-solid:   #1f2937;
      --font-sans:          'Inter', 'Geist', system-ui, sans-serif;
      --font-serif:         'Instrument Serif', 'Noto Serif', serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1140px;
      width: 100%;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--color-rule-solid);
      border-radius: 8px;
      background: #080c14;
      padding: 1rem 0;
    }

    svg {
      width: 100%;
      min-width: 1080px;
      display: block;
    }

    @media print {
      body { padding: 0; background: #0b0f19; }
      svg { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">STORAGE &amp; SCHEMA // IN-PROCESS LATTICEDB</div>
    <h1>Hierarchical Graph &amp; Dual-Index Data Model</h1>
    <div class="diagram-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="d3-dark-title d3-dark-desc">
        <title id="d3-dark-title">LatticeDB Hierarchical Graph and Dual-Index Data Model</title>
        <desc id="d3-dark-desc">Entity-relationship diagram showing Document, Chunk, and Entity models connected to unified HNSW vector and BM25 full-text indices with multi-hop Cypher traversal edges.</desc>
        <defs>
          <marker id="d3-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 1 2 L 8 5 L 1 8 Z" fill="#94a3b8" />
          </marker>
          <marker id="d3-arrow-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 1 2 L 8 5 L 1 8 Z" fill="#22d3ee" />
          </marker>
          <marker id="d3-arrow-link" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 1 2 L 8 5 L 1 8 Z" fill="#818cf8" />
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect x="0" y="0" width="1080" height="380" fill="#080c14" />

        <!-- ========================================== -->
        <!-- CONNECTORS (Drawn first to sit behind nodes) -->
        <!-- ========================================== -->

        <!-- E1: Document -> Chunk (HAS_CHUNK) -->
        <line x1="250" y1="120" x2="310" y2="120" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#d3-arrow)" />
        <rect x="254" y="112" width="50" height="15" fill="#080c14" />
        <text x="279" y="123" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#94a3b8">HAS_CHUNK</text>

        <!-- E2: Chunk -> Entity (CONTAINS grounding) -->
        <line x1="560" y1="120" x2="620" y2="120" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#d3-arrow-accent)" />
        <rect x="568" y="112" width="44" height="15" fill="#080c14" />
        <text x="590" y="123" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#22d3ee">CONTAINS</text>

        <!-- E3: Entity -> Entity (Self-loop RELATION 1-2 hop Cypher) -->
        <path d="M 750 60 L 750 44 A 8 8 0 0 1 758 36 L 802 36 A 8 8 0 0 1 810 44 L 810 60" fill="none" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#d3-arrow-accent)" />
        <rect x="758" y="28" width="52" height="15" fill="#080c14" />
        <text x="784" y="39" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#22d3ee">RELATION (2-Hop)</text>

        <!-- E4: Chunk -> IndexCatalog (Downwards r=8 elbow) -->
        <path d="M 435 220 L 435 244 A 8 8 0 0 0 443 252 L 490 252" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d3-arrow-link)" />
        <rect x="440" y="244" width="44" height="15" fill="#080c14" />
        <text x="462" y="255" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#818cf8">INDEXES</text>

        <!-- E5: Entity -> IndexCatalog (Downwards r=8 elbow) -->
        <path d="M 740 220 L 740 244 A 8 8 0 0 1 732 252 L 690 252" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d3-arrow-link)" />
        <rect x="696" y="244" width="34" height="15" fill="#080c14" />
        <text x="713" y="255" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#818cf8">HNSW</text>

        <!-- ========================================== -->
        <!-- ENTITY 1: :Document                        -->
        <!-- ========================================== -->
        <rect x="40" y="60" width="210" height="160" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
        <rect x="40" y="60" width="210" height="32" rx="6" fill="rgba(148,163,184,0.12)" />
        <text x="52" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">:Document</text>
        <text x="190" y="80" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8">NODE</text>
        <line x1="40" y1="92" x2="250" y2="92" stroke="#334155" stroke-width="1" />

        <!-- Fields -->
        <text x="52" y="112" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">doc_id</text>
        <text x="140" y="112" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">string</text>
        <text x="210" y="112" font-family="'Geist Mono', monospace" font-size="7.5" fill="#34d399">PK</text>

        <text x="52" y="134" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">title</text>
        <text x="140" y="134" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">string</text>

        <text x="52" y="156" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">source_uri</text>
        <text x="140" y="156" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">string</text>

        <text x="52" y="178" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">chunk_count</text>
        <text x="140" y="178" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">int</text>

        <text x="52" y="200" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">created_at</text>
        <text x="140" y="200" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">timestamp</text>

        <!-- ========================================== -->
        <!-- ENTITY 2: :Chunk                           -->
        <!-- ========================================== -->
        <rect x="310" y="60" width="250" height="160" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
        <rect x="310" y="60" width="250" height="32" rx="6" fill="rgba(148,163,184,0.12)" />
        <text x="322" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">:Chunk</text>
        <text x="500" y="80" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8">TEXT NODE</text>
        <line x1="310" y1="92" x2="560" y2="92" stroke="#334155" stroke-width="1" />

        <!-- Fields -->
        <text x="322" y="112" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">id</text>
        <text x="420" y="112" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">int</text>
        <text x="520" y="112" font-family="'Geist Mono', monospace" font-size="7.5" fill="#34d399">PK</text>

        <text x="322" y="134" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">doc_id</text>
        <text x="420" y="134" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">string</text>
        <text x="520" y="134" font-family="'Geist Mono', monospace" font-size="7.5" fill="#818cf8">FK</text>

        <text x="322" y="156" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">text</text>
        <text x="420" y="156" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">string</text>
        <text x="488" y="156" font-family="'Geist Mono', monospace" font-size="7.5" fill="#22d3ee">BM25 @@</text>

        <text x="322" y="178" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">position</text>
        <text x="420" y="178" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">int</text>

        <text x="322" y="200" font-family="'Geist Mono', monospace" font-size="8.5" fill="#f1f5f9">embedding</text>
        <text x="420" y="200" font-family="'Geist Mono', monospace" font-size="8.5" fill="#94a3b8">vec[384]</text>
        <text x="488" y="200" font-family="'Geist Mono', monospace" font-size="7.5" fill="#22d3ee">HNSW &lt;=&gt;</text>

        <!-- ========================================== -->
        <!-- ENTITY 3: :Entity (FOCAL ACCENT)          -->
        <!-- ========================================== -->
        <rect x="620" y="60" width="240" height="160" rx="6" fill="rgba(34,211,238,0.10)" stroke="#22d3ee" stroke-width="1.2" />
        <rect x="620" y="60" width="240" height="32" rx="6" fill="rgba(34,211,238,0.22)" />
        <text x="632" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff">:Entity</text>
        <text x="770" y="80" font-family="'Geist Mono', monospace" font-size="8" fill="#22d3ee">GRAPH NODE</text>
        <line x1="620" y1="92" x2="860" y2="92" stroke="#22d3ee" stroke-width="1" />

        <!-- Fields -->
        <text x="632" y="112" font-family="'Geist Mono', monospace" font-size="8.5" fill="#ffffff">id</text>
        <text x="730" y="112" font-family="'Geist Mono', monospace" font-size="8.5" fill="#22d3ee">int</text>
        <text x="815" y="112" font-family="'Geist Mono', monospace" font-size="7.5" fill="#34d399">PK</text>

        <text x="632" y="134" font-family="'Geist Mono', monospace" font-size="8.5" fill="#ffffff">name</text>
        <text x="730" y="134" font-family="'Geist Mono', monospace" font-size="8.5" fill="#22d3ee">string</text>
        <text x="795" y="134" font-family="'Geist Mono', monospace" font-size="7.5" fill="#22d3ee">FTS INDEX</text>

        <text x="632" y="156" font-family="'Geist Mono', monospace" font-size="8.5" fill="#ffffff">entity_type</text>
        <text x="730" y="156" font-family="'Geist Mono', monospace" font-size="8.5" fill="#22d3ee">string</text>
        <text x="800" y="156" font-family="'Geist Mono', monospace" font-size="7.5" fill="#818cf8">TAXONOMY</text>

        <text x="632" y="178" font-family="'Geist Mono', monospace" font-size="8.5" fill="#ffffff">embedding</text>
        <text x="730" y="178" font-family="'Geist Mono', monospace" font-size="8.5" fill="#22d3ee">vec[384]</text>
        <text x="795" y="178" font-family="'Geist Mono', monospace" font-size="7.5" fill="#22d3ee">HNSW &lt;=&gt;</text>

        <text x="632" y="200" font-family="'Geist Mono', monospace" font-size="8.5" fill="#ffffff">mention_count</text>
        <text x="730" y="200" font-family="'Geist Mono', monospace" font-size="8.5" fill="#22d3ee">int</text>

        <!-- ========================================== -->
        <!-- ENTITY 4: :IndexCatalog (Virtual Catalog)  -->
        <!-- ========================================== -->
        <rect x="490" y="232" width="200" height="90" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
        <rect x="490" y="232" width="200" height="26" rx="6" fill="rgba(129,140,248,0.15)" />
        <text x="502" y="249" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#818cf8">:IndexCatalog</text>
        <text x="625" y="249" font-family="'Geist Mono', monospace" font-size="7.5" fill="#818cf8">IN-PROCESS</text>
        <line x1="490" y1="258" x2="690" y2="258" stroke="#334155" stroke-width="1" />

        <text x="502" y="274" font-family="'Geist Mono', monospace" font-size="8" fill="#f1f5f9">HNSW Index</text>
        <text x="580" y="274" font-family="'Geist Mono', monospace" font-size="8" fill="#22d3ee">&lt;=&gt; Cosine L2 (sub-ms)</text>

        <text x="502" y="292" font-family="'Geist Mono', monospace" font-size="8" fill="#f1f5f9">BM25 Index</text>
        <text x="580" y="292" font-family="'Geist Mono', monospace" font-size="8" fill="#22d3ee">@@ Full-Text Inverted</text>

        <text x="502" y="310" font-family="'Geist Mono', monospace" font-size="8" fill="#f1f5f9">Cypher Engine</text>
        <text x="580" y="310" font-family="'Geist Mono', monospace" font-size="8" fill="#34d399">Direct C Pointers</text>

        <!-- ========================================== -->
        <!-- LEGEND STRIP (Horizontal bottom strip)      -->
        <!-- ========================================== -->
        <line x1="40" y1="340" x2="1040" y2="340" stroke="rgba(34,211,238,0.20)" stroke-width="1" />

        <rect x="40" y="352" width="12" height="12" rx="3" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1" />
        <text x="60" y="361" font-family="'Geist Mono', monospace" font-size="8" fill="#22d3ee">FOCAL ENTITY</text>
        <text x="132" y="361" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">LatticeDB Knowledge Graph Node</text>

        <line x1="340" y1="358" x2="364" y2="358" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#d3-arrow-accent)" />
        <text x="374" y="361" font-family="'Geist Mono', monospace" font-size="8" fill="#22d3ee">CYPHER RELATION</text>
        <text x="466" y="361" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Multi-Hop Dynamic Edge</text>

        <line x1="640" y1="358" x2="664" y2="358" stroke="#818cf8" stroke-width="1.2" marker-end="url(#d3-arrow-link)" />
        <text x="674" y="361" font-family="'Geist Mono', monospace" font-size="8" fill="#818cf8">DUAL-INDEX</text>
        <text x="740" y="361" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Unified HNSW &lt;=&gt; and BM25 @@</text>

        <line x1="910" y1="358" x2="934" y2="358" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#d3-arrow)" />
        <text x="944" y="361" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8">HIERARCHY</text>
        <text x="1000" y="361" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">1:N Chunking</text>

      </svg>
    </div>
  </div>
</body>
</html>
