<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" viewBox="0 0 1000 480" width="1000" height="480" xmlns="http://www.w3.org/2000/svg" aria-labelledby="d10-light-title d10-light-desc" id="d10-cicd-pipeline-light-root">
        <title id="d10-light-title">Strict CI/CD Quality Gates &amp; Release Pipeline Diagram</title>
        <desc id="d10-light-desc">Pipeline diagram illustrating code commit triggers fanning out into parallel quality gates (Ruff linting, Mypy strict typing, Bandit security audit, and Hermetic Pytest), fanning in to a golden dataset evaluation gate, and releasing to Docker.</desc>

        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d10-cicd-pipeline-light-root { --color-paper:        #f8fafc;
      --color-paper-2:      #ffffff;
      --color-ink:          #0f172a;
      --color-muted:        #475569;
      --color-soft:         #64748b;
      --color-accent:       #0e7490;
      --color-accent-tint:  rgba(14, 116, 144, 0.10);
      --color-link:         #4338ca;
      --color-rule:         rgba(14, 116, 144, 0.20);
      --color-rule-solid:   #e2e8f0;
      --color-emerald:      #047857;
      --color-emerald-tint: rgba(4, 120, 87, 0.10);
      --color-coral:        #be123c;
      --font-sans:          'Inter', 'Geist', system-ui, sans-serif;
      --font-serif:         'Instrument Serif', 'Noto Serif', serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace; }
      #d10-cicd-pipeline-light-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d10-cicd-pipeline-light-root .lead { color: var(--color-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 820px;
      margin-bottom: 1.75rem; }
      #d10-cicd-pipeline-light-root .diagram-card { background: var(--color-paper-2);
      border: 1px solid var(--color-rule-solid);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08); }
      #d10-cicd-pipeline-light-root .card-footer { display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule-solid);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted); }
      #d10-cicd-pipeline-light-root .card-footer a { color: var(--color-accent);
      text-decoration: none; }</style>
          <marker id="d10-cicd-pipeline-light-d10-light-arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#475569"/>
          </marker>
          <marker id="d10-cicd-pipeline-light-d10-light-arr-accent" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#0e7490"/>
          </marker>
          <marker id="d10-cicd-pipeline-light-d10-light-arr-emerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#047857"/>
          </marker>
          <marker id="d10-cicd-pipeline-light-d10-light-arr-indigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 1 1 L 7 4 L 1 7 Z" fill="#4338ca"/>
          </marker>

          <filter id="d10-cicd-pipeline-light-d10-light-shadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
          </filter>
        </defs>

        <!-- ========================================== -->
        <!-- CONNECTORS (DRAWN BEFORE NODES FOR DEPTH) -->
        <!-- ========================================== -->
        <g id="d10-light-connectors">
          <!-- FAN-OUT CONNECTORS (TRIGGER -> 4 GATES) -->
          <!-- 1. Trigger -> Gate 1 Ruff -->
          <path d="M 175 240 L 197 240 A 8 8 0 0 0 205 232 L 205 98 A 8 8 0 0 1 213 90 L 232 90" fill="none" stroke="#4338ca" stroke-width="1.5" marker-end="url(#d10-cicd-pipeline-light-d10-light-arr-indigo)"/>

          <!-- 2. Trigger -> Gate 2 Mypy -->
          <path d="M 175 240 L 197 240 A 8 8 0 0 0 205 232 L 205 198 A 8 8 0 0 1 213 190 L 232 190" fill="none" stroke="#4338ca" stroke-width="1.5" marker-end="url(#d10-cicd-pipeline-light-d10-light-arr-indigo)"/>

          <!-- 3. Trigger -> Gate 3 Security -->
          <path d="M 175 240 L 197 240 A 8 8 0 0 1 205 248 L 205 282 A 8 8 0 0 0 213 290 L 232 290" fill="none" stroke="#4338ca" stroke-width="1.5" marker-end="url(#d10-cicd-pipeline-light-d10-light-arr-indigo)"/>

          <!-- 4. Trigger -> Gate 4 Pytest -->
          <path d="M 175 240 L 197 240 A 8 8 0 0 1 205 248 L 205 382 A 8 8 0 0 0 213 390 L 232 390" fill="none" stroke="#4338ca" stroke-width="1.5" marker-end="url(#d10-cicd-pipeline-light-d10-light-arr-indigo)"/>

          <!-- FAN-OUT LABEL -->
          <rect x="175" y="165" width="55" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="202" y="178" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">PARALLEL</text>

          <!-- FAN-IN CONNECTORS (4 GATES -> EVALUATION GATE) -->
          <!-- 5. Gate 1 Ruff -> Eval -->
          <path d="M 460 90 L 492 90 A 8 8 0 0 1 500 98 L 500 232 A 8 8 0 0 0 508 240 L 532 240" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#d10-cicd-pipeline-light-d10-light-arr-emerald)"/>

          <!-- 6. Gate 2 Mypy -> Eval -->
          <path d="M 460 190 L 492 190 A 8 8 0 0 1 500 198 L 500 232 A 8 8 0 0 0 508 240 L 532 240" fill="none" stroke="#047857" stroke-width="1.5"/>

          <!-- 7. Gate 3 Security -> Eval -->
          <path d="M 460 290 L 492 290 A 8 8 0 0 0 500 282 L 500 248 A 8 8 0 0 1 508 240 L 532 240" fill="none" stroke="#047857" stroke-width="1.5"/>

          <!-- 8. Gate 4 Pytest -> Eval -->
          <path d="M 460 390 L 492 390 A 8 8 0 0 0 500 382 L 500 248 A 8 8 0 0 1 508 240 L 532 240" fill="none" stroke="#047857" stroke-width="1.5"/>

          <!-- FAN-IN LABEL -->
          <rect x="475" y="165" width="55" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="502" y="178" fill="#047857" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">4 / 4 PASS</text>

          <!-- 9. EVAL -> DOCKER RELEASE -->
          <line x1="760" y1="240" x2="822" y2="240" stroke="#0e7490" stroke-width="2" marker-end="url(#d10-cicd-pipeline-light-d10-light-arr-accent)"/>
          <rect x="768" y="230" width="48" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="792" y="244" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle">SLA OK</text>
        </g>

        <!-- ========================================== -->
        <!-- 7 PIPELINE NODES                           -->
        <!-- ========================================== -->

        <!-- NODE 1: TRIGGER (GITHUB INGRESS) -->
        <g id="d10-light-node-1" filter="url(#d10-cicd-pipeline-light-d10-light-shadow)">
          <rect x="35" y="160" width="140" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="47" y="172" width="70" height="18" rx="3" fill="#f1f5f9"/>
          <text x="82" y="185" fill="#475569" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">TRIGGER</text>

          <text x="47" y="210" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Git Commit</text>
          <text x="47" y="226" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="10">main • PR Hook</text>

          <line x1="47" y1="238" x2="163" y2="238" stroke="#e2e8f0" stroke-width="1"/>

          <text x="47" y="258" fill="#0f172a" font-family="'Inter', sans-serif" font-size="10.5">• Push to main</text>
          <text x="47" y="276" fill="#475569" font-family="'Inter', sans-serif" font-size="10">• Pull Request</text>
          <text x="47" y="294" fill="#475569" font-family="'Inter', sans-serif" font-size="10">• Concurrency Cancel</text>
        </g>

        <!-- NODE 2: GATE 1 (RUFF LINTER & FORMATTER) -->
        <g id="d10-light-node-2" filter="url(#d10-cicd-pipeline-light-d10-light-shadow)">
          <rect x="240" y="50" width="220" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="252" y="60" width="85" height="16" rx="3" fill="#f1f5f9"/>
          <text x="294" y="72" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">GATE 01 • LINT</text>

          <text x="252" y="94" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Ruff Linter &amp; Formatter</text>
          <text x="252" y="110" fill="#475569" font-family="'Geist Mono', monospace" font-size="9.5">ruff check --select E,F,W,I,SIM</text>
          <text x="445" y="72" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="end">&lt;1s</text>
        </g>

        <!-- NODE 3: GATE 2 (MYPY STRICT TYPE CHECKING) -->
        <g id="d10-light-node-3" filter="url(#d10-cicd-pipeline-light-d10-light-shadow)">
          <rect x="240" y="150" width="220" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="252" y="160" width="85" height="16" rx="3" fill="#f1f5f9"/>
          <text x="294" y="172" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">GATE 02 • TYPES</text>

          <text x="252" y="194" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Mypy Strict Typing</text>
          <text x="252" y="210" fill="#475569" font-family="'Geist Mono', monospace" font-size="9.5">mypy --strict src/ (0 errors)</text>
          <text x="445" y="172" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="end">strict</text>
        </g>

        <!-- NODE 4: GATE 3 (SECURITY AUDIT & SECRET SCAN) -->
        <g id="d10-light-node-4" filter="url(#d10-cicd-pipeline-light-d10-light-shadow)">
          <rect x="240" y="250" width="220" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="252" y="260" width="95" height="16" rx="3" fill="#f1f5f9"/>
          <text x="299" y="272" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">GATE 03 • SECURITY</text>

          <text x="252" y="294" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Zero-Leakage Security Scan</text>
          <text x="252" y="310" fill="#475569" font-family="'Geist Mono', monospace" font-size="9.5">test_security_audit.py • SecretStr</text>
          <text x="445" y="272" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="end">0 leaks</text>
        </g>

        <!-- NODE 5: GATE 4 (HERMETIC PYTEST SUITE) -->
        <g id="d10-light-node-5" filter="url(#d10-cicd-pipeline-light-d10-light-shadow)">
          <rect x="240" y="350" width="220" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <rect x="252" y="360" width="85" height="16" rx="3" fill="#f1f5f9"/>
          <text x="294" y="372" fill="#4338ca" font-family="'Geist Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">GATE 04 • TESTS</text>

          <text x="252" y="394" fill="#0f172a" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600">Hermetic Pytest Matrix</text>
          <text x="252" y="410" fill="#475569" font-family="'Geist Mono', monospace" font-size="9.5">pytest tests/unit/ (133 green)</text>
          <text x="445" y="372" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5" text-anchor="end">100%</text>
        </g>

        <!-- NODE 6: EVALUATION GATE (GOLDEN DATASET - FOCAL ACCENT 1) -->
        <g id="d10-light-node-6" filter="url(#d10-cicd-pipeline-light-d10-light-shadow)">
          <rect x="540" y="165" width="220" height="150" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
          <rect x="552" y="177" width="105" height="18" rx="3" fill="#0e7490" fill-opacity="0.12"/>
          <text x="604" y="190" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">EVAL GATE [FOCAL]</text>

          <text x="552" y="216" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">Golden Dataset Gate</text>
          <text x="552" y="234" fill="#0e7490" font-family="'Geist Mono', monospace" font-size="9.5">lattice-rag eval --baseline</text>

          <line x1="552" y1="246" x2="748" y2="246" stroke="#e2e8f0" stroke-width="1"/>

          <text x="552" y="266" fill="#0f172a" font-family="'Inter', sans-serif" font-size="10.5">• Groundedness &gt; 0.90</text>
          <text x="552" y="284" fill="#0f172a" font-family="'Inter', sans-serif" font-size="10.5">• Dual-SLA p95 &lt; 1,000ms</text>
          <text x="552" y="302" fill="#047857" font-family="'Geist Mono', monospace" font-size="9.5">p95 = 545.4ms [PASSED]</text>
        </g>

        <!-- NODE 7: CONTAINER RELEASE (DOCKER ARTIFACT - FOCAL ACCENT 2) -->
        <g id="d10-light-node-7" filter="url(#d10-cicd-pipeline-light-d10-light-shadow)">
          <rect x="830" y="165" width="135" height="150" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
          <rect x="842" y="177" width="60" height="18" rx="3" fill="#047857" fill-opacity="0.12"/>
          <text x="872" y="190" fill="#047857" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">RELEASE</text>

          <text x="842" y="216" fill="#0f172a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Docker Image</text>
          <text x="842" y="234" fill="#047857" font-family="'Geist Mono', monospace" font-size="9">ghcr.io:latest</text>

          <line x1="842" y1="246" x2="953" y2="246" stroke="#e2e8f0" stroke-width="1"/>

          <text x="842" y="266" fill="#0f172a" font-family="'Inter', sans-serif" font-size="10">• Hermetic build</text>
          <text x="842" y="284" fill="#475569" font-family="'Inter', sans-serif" font-size="10">• Signed digest</text>
          <text x="842" y="302" fill="#047857" font-family="'Geist Mono', monospace" font-size="9">0 defects</text>
        </g>
      </svg>
