<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice RAG — Sub-Second SLA Latency Waterfall</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:        #0b0f19;
      --color-paper-2:      #111827;
      --color-ink:          #f1f5f9;
      --color-muted:        #94a3b8;
      --color-soft:         #cbd5e1;
      --color-accent:       #22d3ee;
      --color-accent-tint:  rgba(34, 211, 238, 0.12);
      --color-link:         #818cf8;
      --color-rule:         rgba(34, 211, 238, 0.20);
      --color-rule-solid:   #1f2937;
      --font-sans:          'Inter', 'Geist', system-ui, sans-serif;
      --font-serif:         'Instrument Serif', 'Noto Serif', serif;
      --font-mono:          'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1140px;
      width: 100%;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--color-rule-solid);
      border-radius: 8px;
      background: #080c14;
      padding: 1rem 0;
    }

    svg {
      width: 100%;
      min-width: 1080px;
      display: block;
    }

    @media print {
      body { padding: 0; background: #0b0f19; }
      svg { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">EMPIRICAL BENCHMARK // DUAL-SLA VERIFICATION</div>
    <h1>Sub-Second Pipeline Latency Waterfall</h1>
    <div class="diagram-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="d4-dark-title d4-dark-desc">
        <title id="d4-dark-title">Lattice RAG Sub-Second Latency Waterfall Diagram</title>
        <desc id="d4-dark-desc">Stepped waterfall diagram displaying p95 latencies across Front-Door Triage, Stage 1 HNSW recall, Stage 2 Cypher traversal, and Stage 3 Cross-Encoder reranking totaling 545.4ms under the 1,000ms SLA ceiling.</desc>
        <defs>
          <marker id="d4-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 1 2 L 8 5 L 1 8 Z" fill="#94a3b8" />
          </marker>
          <marker id="d4-arrow-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 1 2 L 8 5 L 1 8 Z" fill="#22d3ee" />
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect x="0" y="0" width="1080" height="390" fill="#080c14" />

        <!-- ========================================== -->
        <!-- GRID BASELINES & SLA CEILING               -->
        <!-- ========================================== -->

        <!-- 1,000ms SLA Target Line (y=80) -->
        <line x1="80" y1="80" x2="860" y2="80" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="6,4" />
        <rect x="80" y="68" width="168" height="15" rx="2" fill="#080c14" />
        <text x="84" y="79" font-family="'Geist Mono', monospace" font-size="7.5" fill="#fb7185" letter-spacing="0.1em">SLA CEILING: 1,000ms</text>

        <!-- 500ms Grid Line (y=175) -->
        <line x1="80" y1="175" x2="860" y2="175" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="4,4" />
        <text x="64" y="178" font-family="'Geist Mono', monospace" font-size="8" fill="#475569" text-anchor="end">500ms</text>

        <!-- 250ms Grid Line (y=222) -->
        <line x1="80" y1="222" x2="860" y2="222" stroke="#1f2937" stroke-width="0.8" stroke-dasharray="4,4" />
        <text x="64" y="225" font-family="'Geist Mono', monospace" font-size="8" fill="#475569" text-anchor="end">250ms</text>

        <!-- 0ms Baseline (y=270) -->
        <line x1="80" y1="270" x2="860" y2="270" stroke="#334155" stroke-width="1.2" />
        <text x="64" y="273" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="end">0ms</text>

        <!-- Headroom Bracket (from 545.4ms at y=166 up to 1000ms at y=80) -->
        <line x1="770" y1="84" x2="770" y2="162" stroke="#34d399" stroke-width="1.2" marker-start="url(#d4-arrow)" marker-end="url(#d4-arrow)" />
        <rect x="778" y="116" width="100" height="24" rx="4" fill="#111827" stroke="#34d399" stroke-width="1" />
        <text x="828" y="128" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#34d399">+454.6ms HEADROOM</text>
        <text x="828" y="137" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#94a3b8">45.5% Safety Margin</text>

        <!-- ========================================== -->
        <!-- WATERFALL BARS                             -->
        <!-- ========================================== -->

        <!-- Bar 1: Front-Door Triage (+1.2ms) -->
        <!-- x=100, y=268, w=90, h=2 -->
        <rect x="100" y="267" width="90" height="3" rx="1.5" fill="#818cf8" />
        <text x="145" y="258" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#818cf8">+1.2ms</text>
        <text x="145" y="286" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Triage</text>
        <text x="145" y="299" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#94a3b8">Cache Check</text>

        <!-- Step bridge line 1 -> 2 -->
        <line x1="190" y1="267" x2="220" y2="267" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />

        <!-- Bar 2: Stage 1 HNSW+BM25 (+8.5ms) -->
        <!-- x=220, y=265, w=90, h=3 -->
        <rect x="220" y="265" width="90" height="3" rx="1.5" fill="#34d399" />
        <text x="265" y="256" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#34d399">+8.5ms</text>
        <text x="265" y="286" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Stage 1</text>
        <text x="265" y="299" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#94a3b8">HNSW + BM25</text>

        <!-- Step bridge line 2 -> 3 -->
        <line x1="310" y1="265" x2="340" y2="265" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />

        <!-- Bar 3: Stage 2 Cypher Traversal (+0.8ms) -->
        <!-- x=340, y=264, w=90, h=2 -->
        <rect x="340" y="264" width="90" height="2" rx="1" fill="#34d399" />
        <text x="385" y="255" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#34d399">+0.8ms</text>
        <text x="385" y="286" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Stage 2</text>
        <text x="385" y="299" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#94a3b8">2-Hop Cypher</text>

        <!-- Step bridge line 3 -> 4 -->
        <line x1="430" y1="264" x2="460" y2="264" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />

        <!-- Bar 4: Stage 3 Cross-Encoder Precision Rerank (+523.7ms) - FOCAL ACCENT -->
        <!-- From y=264 upwards by 98px -> y=166, w=90 -->
        <rect x="460" y="166" width="90" height="98" rx="4" fill="rgba(34,211,238,0.18)" stroke="#22d3ee" stroke-width="1.2" />
        <text x="505" y="156" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#22d3ee">+523.7ms</text>
        <text x="505" y="286" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Stage 3</text>
        <text x="505" y="299" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#22d3ee">bge-reranker v2</text>

        <!-- Step bridge line 4 -> 5 -->
        <line x1="550" y1="166" x2="580" y2="166" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />

        <!-- Bar 5: Assembly Overhead (+11.2ms) -->
        <rect x="580" y="164" width="90" height="3" rx="1.5" fill="#94a3b8" />
        <text x="625" y="155" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#94a3b8">+11.2ms</text>
        <text x="625" y="286" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Overhead</text>
        <text x="625" y="299" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#94a3b8">StateGraph</text>

        <!-- Total Cumulative Pillar: 545.4ms -->
        <rect x="700" y="164" width="60" height="106" rx="4" fill="#111827" stroke="#34d399" stroke-width="1.2" />
        <text x="730" y="154" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#34d399">545.4ms</text>
        <text x="730" y="286" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Total E2E</text>
        <text x="730" y="299" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#34d399">p95 Multi-Hop</text>

        <!-- ========================================== -->
        <!-- INSET SUMMARY CARD: TIER 1 CACHE SLA       -->
        <!-- ========================================== -->
        <rect x="890" y="70" width="150" height="175" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
        <rect x="890" y="70" width="150" height="26" rx="6" fill="rgba(34,211,238,0.12)" />
        <text x="965" y="87" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#22d3ee">DUAL-SLA SUMMARY</text>

        <!-- Item 1: Multi-Hop SLA -->
        <text x="902" y="112" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">Multi-Hop SLA:</text>
        <text x="902" y="125" font-family="'Geist Mono', monospace" font-size="8" fill="#34d399">545.4ms &lt; 1000ms</text>
        <text x="902" y="137" font-family="'Geist Mono', monospace" font-size="7" fill="#94a3b8">Status: [PASSED]</text>

        <line x1="902" y1="146" x2="1028" y2="146" stroke="#1f2937" stroke-width="1" />

        <!-- Item 2: Cache SLA -->
        <text x="902" y="162" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">Tier 1 Cache SLA:</text>
        <text x="902" y="175" font-family="'Geist Mono', monospace" font-size="8" fill="#34d399">1.2ms &lt; 25ms</text>
        <text x="902" y="187" font-family="'Geist Mono', monospace" font-size="7" fill="#94a3b8">Throughput: 4,076 QPS</text>

        <line x1="902" y1="196" x2="1028" y2="196" stroke="#1f2937" stroke-width="1" />

        <!-- Item 3: Overall -->
        <rect x="902" y="206" width="126" height="24" rx="3" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="0.8" />
        <text x="965" y="222" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#34d399">100% SLA COMPLIANT</text>

        <!-- ========================================== -->
        <!-- LEGEND STRIP (Horizontal bottom strip)      -->
        <!-- ========================================== -->
        <line x1="40" y1="340" x2="1040" y2="340" stroke="rgba(34,211,238,0.20)" stroke-width="1" />

        <rect x="40" y="352" width="12" height="12" rx="3" fill="rgba(34,211,238,0.2)" stroke="#22d3ee" stroke-width="1" />
        <text x="60" y="361" font-family="'Geist Mono', monospace" font-size="8" fill="#22d3ee">FOCAL COMPONENT</text>
        <text x="144" y="361" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">CPU Cross-Encoder Rerank (bge-v2-m3)</text>

        <rect x="390" y="352" width="12" height="12" rx="3" fill="#34d399" />
        <text x="410" y="361" font-family="'Geist Mono', monospace" font-size="8" fill="#34d399">SUB-MS STAGES</text>
        <text x="488" y="361" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">HNSW Recall &amp; Cypher Graph Traversal</text>

        <line x1="710" y1="358" x2="734" y2="358" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3" />
        <text x="744" y="361" font-family="'Geist Mono', monospace" font-size="8" fill="#fb7185">SLA CEILING</text>
        <text x="806" y="361" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">1,000ms Hard Performance Floor</text>

      </svg>
    </div>
  </div>
</body>
</html>
